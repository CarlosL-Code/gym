<section class="py-24 px-margin-mobile md:px-margin-desktop bg-surface relative overflow-hidden" id="faq">
  <div class="max-w-7xl mx-auto">
    
    <div class="flex flex-col lg:flex-row gap-12 lg:gap-16 items-center">
      
      <!-- Columna Izquierda: Composición Dual 16:9 -->
      <div class="w-full lg:w-1/2 relative space-y-5">
        <!-- Resplandor Metálico -->
        <div class="absolute inset-0 bg-primary/15 blur-[90px] rounded-full pointer-events-none"></div>
        
        <!-- Imagen Superior 16:9 -->
        <div class="relative w-full aspect-video rounded-3xl overflow-hidden border border-white/10 shadow-[0_15px_40px_rgba(0,0,0,0.6)] group">
          <img src="/assets/img-octubre-2026/peso-muerto.webp" alt="Zona de Peso Libre Elixir Gym" loading="lazy" class="w-full h-full object-cover transition-transform duration-1000 group-hover:scale-105 saturate-[1.08]">
          <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent"></div>
          <div class="absolute bottom-4 left-5 right-5 flex items-center justify-between">
            <span class="inline-flex items-center gap-2 bg-black/65 backdrop-blur-md border border-primary/40 text-primary text-[10px] font-black uppercase tracking-[0.25em] px-3.5 py-1.5 rounded-full">
              <i class="bi bi-lightning-charge-fill"></i>
              EQUIPAMIENTO OLÍMPICO
            </span>
            <span class="text-white/80 text-xs font-bold uppercase tracking-wider">Zona Peso Libre</span>
          </div>
        </div>

        <!-- Imagen Inferior 16:9 -->
        <div class="relative w-full aspect-video rounded-3xl overflow-hidden border border-white/10 shadow-[0_15px_40px_rgba(0,0,0,0.6)] group">
          <img src="/assets/img-octubre-2026/coach-guiando.webp" alt="Entrenamiento Guiado Elixir Gym" loading="lazy" class="w-full h-full object-cover transition-transform duration-1000 group-hover:scale-105 saturate-[1.08]">
          <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent"></div>
          <div class="absolute bottom-4 left-5 right-5 flex items-center justify-between">
            <span class="inline-flex items-center gap-2 bg-black/65 backdrop-blur-md border border-white/15 text-white text-[10px] font-black uppercase tracking-[0.25em] px-3.5 py-1.5 rounded-full">
              <i class="bi bi-person-check-fill text-primary"></i>
              ASESORÍA EN SALA
            </span>
            <span class="text-white/80 text-xs font-bold uppercase tracking-wider">Manuel Montt #1027</span>
          </div>
        </div>

        <!-- Nota de Privacidad IA -->
        <p class="text-[11px] text-on-surface-variant/75 flex items-center gap-2 px-2">
          <i class="bi bi-shield-check text-primary shrink-0"></i>
          <span>Fotografías reales de nuestras instalaciones. Rostros modificados con IA para proteger los derechos de privacidad de los asistentes.</span>
        </p>
      </div>
      
      <!-- Columna Derecha: Contenido FAQ -->
      <div class="w-full lg:w-1/2">
        
        <div class="text-left mb-12">
          <h2 class="font-headline-xl text-4xl md:text-5xl text-on-surface uppercase italic font-black">PREGUNTAS <span class="text-gradient">FRECUENTES</span></h2>
          <p class="text-on-surface-variant uppercase tracking-[0.4em] font-label-bold text-[10px] mt-4 flex items-center gap-3">
            <span class="w-12 h-[2px] bg-primary"></span>
            Todo lo que necesitas saber
          </p>
        </div>
        
        <!-- Acordeón FAQ -->
        <div class="space-y-4">
          <div *ngFor="let item of faqs; let i = index" 
               class="bg-surface-container-low/50 backdrop-blur-md rounded-2xl overflow-hidden transition-all duration-300 border border-white/5"
               [ngClass]="openIndex === i ? 'border-primary/50 shadow-[0_10px_30px_rgba(2,132,199,0.15)] bg-surface-container-high/80' : 'hover:border-white/20 hover:bg-surface-container-low'">
            
            <button (click)="toggle(i)" class="w-full px-6 py-6 flex justify-between items-center text-left transition-colors focus:outline-none group">
              <span class="font-label-bold text-xs md:text-sm uppercase tracking-widest text-on-surface pr-8 transition-colors duration-300" 
                    [class.text-primary]="openIndex === i" 
                    [class.group-hover:text-primary]="openIndex !== i">
                {{ item.question }}
              </span>
              <div class="w-8 h-8 rounded-full border border-white/10 flex items-center justify-center transition-all duration-300 shrink-0 bg-white/5" 
                   [ngClass]="openIndex === i ? 'bg-primary border-primary text-black rotate-180' : 'group-hover:bg-primary/20 text-white'">
                <span class="material-symbols-outlined text-sm">
                  expand_more
                </span>
              </div>
            </button>
            
            <div class="overflow-hidden transition-all duration-500 ease-[cubic-bezier(0.25,1,0.5,1)]" 
                 [style.maxHeight]="openIndex === i ? '500px' : '0px'" 
                 [style.opacity]="openIndex === i ? '1' : '0'">
              <div class="px-6 pb-6 pt-2 text-on-surface-variant text-sm leading-relaxed border-t border-white/5 mt-2">
                {{ item.answer }}
              </div>
            </div>
          </div>
        </div>
        
      </div>
      
    </div>
  </div>
</section>
